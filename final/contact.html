<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
        transition: background-color 0.3s, color 0.3s; /* Smooth transitions for mode changes */
    }
    .dark-mode {
        background-color: #121212; /* Dark background */
        color: #ffffff; /* Light text for dark mode */
    }
    .dark-mode a {
        color: #6babff; /* Ensure links remain visible */
    }
    .dark-mode input,
    .dark-mode textarea,
    .dark-mode select {
        background-color: #333333; /* Dark mode for form inputs */
        color: #ffffff;
        border: 1px solid #555555;
    }
    .dark-mode input::placeholder,
    .dark-mode textarea::placeholder {
        color: #cccccc;
    }

    /* Increased Text Size */
    .increase-text {
        font-size: 1.2em; /* Increase base font size by 20% */
    }
    .content-container {
    display: flex;
    flex-direction: column;
    align-items: center; /* Centers content horizontally */
    margin-top: 20px; /* Creates space below the header menu */
    padding: 20px;
    width: 100%; /* Ensures it spans the full width */
    box-sizing: border-box;
    overflow-y: auto; /* Enables vertical scrolling if content overflows */
    height: calc(100vh - 25vh); /* Adjust for your header height */
}

    .content-container {
    margin-top: 60px; /* Matches the header height */
}

    form label {
        font-weight: bold;
    }

    form input,
    form textarea,
    form select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    form button {
        background-color: #0073e6;
        color: #fff;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
    }

    form button:hover {
        background-color: #005bb5;
    }

    </style>
</head>
<body>
    <header>
        <nav class="menu">
          <div class="logo">Daanyaal</div>
          <ul class="menu-items">
            <li><a href="index.html">Home</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li class="spacer"></li>
            <li class="accessibility-dropdown">
                <a href="#">Accessibility</a>
                <ul class="accessibility-options">
                  <li><button id="dark-mode-btn">Dark Mode</button></li>
                  <li><button id="increase-text-btn">Toggle Text Size</button></li>
                </ul>
              </li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><a href="#" id="clickMeButton">Click Me!</a></li>
          </ul>
        </nav>
      </header>
      <ul class="background">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>    
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
      </ul>
    <main>
      <div class="content-container">
        <section>
            <h2>Contact Me</h2>
            <form id="contactForm">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
                <br><br>
                
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                <br><br>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Your Message" rows="4" required></textarea>
                <br><br>
                
                <p>Employment Type:</p>
                <label><input type="radio" name="employmentType" value="Full-Time"> Full-Time</label>
                <label><input type="radio" name="employmentType" value="Part-Time"> Part-Time</label>
                <label><input type="radio" name="employmentType" value="Internship"> Internship</label>
                <br><br>
                
                <p>Relevant Skills:</p>
                <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
                <label><input type="checkbox" name="skills" value="Python"> Python</label>
                <label><input type="checkbox" name="skills" value="Project Management"> Project Management</label>
                <label><input type="checkbox" name="skills" value="Data Analysis"> Data Analysis</label>
                <br><br>
                
                <label for="referral">How did you find me?</label>
                <select id="referral" name="referral">
                    <option value="LinkedIn">LinkedIn</option>
                    <option value="Personal Website">Personal Website</option>
                    <option value="Job Board">Job Board</option>
                    <option value="Referral">Referral</option>
                </select>
                <br><br>
                
                <button type="button" onclick="submitForm()">Submit</button>
                <button type="reset">Clear</button>
            </form>
        </section>
        
        <script>
            const darkModeBtn = document.getElementById('dark-mode-btn');
        const increaseTextBtn = document.getElementById('increase-text-btn');
        let isDarkMode = false;
        let isTextIncreased = false;

        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            isDarkMode = !isDarkMode;
        });

        increaseTextBtn.addEventListener('click', () => {
            document.body.classList.toggle('increase-text');
            isTextIncreased = !isTextIncreased;
        });

        function submitForm() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const employmentType = document.querySelector('input[name="employmentType"]:checked')?.value;
            const skills = Array.from(document.querySelectorAll('input[name="skills"]:checked')).map(cb => cb.value);
            const referral = document.getElementById('referral').value;

            const formData = { name, email, message, employmentType, skills, referral };
            localStorage.setItem('contactFormData', JSON.stringify(formData));
            alert('Your information has been saved!');
        }
        </script>
        
        <section>
            <p>You can reach me via email at <a href="mailto:dbhagaria@torontomu.ca">dbhagaria@torontomu.ca</a>.</p>
        </section>
      </div>
    </main>
</body>
</html>
