<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Accessibility</h1>

    <!-- video section -->
    <section>
        <h2>Audio/Video Content</h2>
        <p>Here’s a media file with custom controls.</p>
        <video controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the audio element.
        </video>
        <p class="caption">Figure 1. Trailer for The Batman (2022)... It was the first thing I thought of. </p>
    </section>

    <!-- accessibility feature buttons -->
    <section>
        <h2>Accessibility Controls</h2>
        <button onclick="increaseTextSize()">Increase Text Size</button>
        <button onclick="toggleColorMode()">Toggle Color Mode</button>
    </section>

    <!-- image Section -->
    <section>
        <h2>Image Gallery with Alt Text</h2>
        <div class="image-container">
            <img id="image1" src="image1.jpg" alt=" A closeup of my keyboard. I want elements of my website to have the same neon borders around them as you see here.">
            <button onclick="showAltText('image1')">Show Alt Text</button>
            <p class="caption">Image #1</p>
        </div>
        <div class="image-container">
            <img id="image2" src="image2.jpg" alt="My watch. I want my website to have the time displayed somewhere on every page.">
            <button onclick="showAltText('image2')">Show Alt Text</button>
            <p class="caption">Image #2 </p>
        </div>
        <div class="image-container">
            <img id="image3" src="image3.jpg" alt="A picture of a random portable gaming console I have in my room. I want my website to incorporate mini games in a way I haven't figured out yet.">
            <button onclick="showAltText('image3')">Show Alt Text</button>
            <p class="caption">Image #3</p>
        </div>
    </section>

    <script src="script.js"></script>
    <footer style="text-align: center; padding: 10px; margin-top: 20px; font-size: 0.9em; color: gray;">
        <p>&copy; By: Daanyaal Bhagaria</p>
    </footer>
</body>
</html>
